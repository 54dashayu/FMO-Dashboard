name: macOS App Store Release

on:
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: Upload the generated PKG to App Store Connect
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    name: Build macOS App Store PKG
    runs-on: macos-latest
    env:
      HAS_MAC_APPSTORE_SIGNING: ${{ secrets.MAC_APPSTORE_CERTIFICATE_P12_BASE64 != '' && secrets.MAC_APPSTORE_CERTIFICATE_PASSWORD != '' && secrets.MAC_APPSTORE_INSTALLER_CERTIFICATE_BASE64 != '' && secrets.MAC_APPSTORE_PROVISION_PROFILE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_APPSTORE_UPLOAD: ${{ secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Fail when App Store signing is unavailable
        if: ${{ env.HAS_MAC_APPSTORE_SIGNING != 'true' }}
        shell: bash
        run: |
          echo "macOS App Store signing secrets are not fully configured." >&2
          echo "Required repository secrets:" >&2
          echo "  MAC_APPSTORE_CERTIFICATE_P12_BASE64" >&2
          echo "  MAC_APPSTORE_CERTIFICATE_PASSWORD" >&2
          echo "  MAC_APPSTORE_INSTALLER_CERTIFICATE_BASE64" >&2
          echo "  MAC_APPSTORE_PROVISION_PROFILE_BASE64" >&2
          echo "  APPLE_TEAM_ID" >&2
          exit 1

      - name: Import App Store certificates and provisioning profile
        if: ${{ env.HAS_MAC_APPSTORE_SIGNING == 'true' }}
        env:
          MAC_APPSTORE_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_APPSTORE_CERTIFICATE_P12_BASE64 }}
          MAC_APPSTORE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_APPSTORE_CERTIFICATE_PASSWORD }}
          MAC_APPSTORE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_APPSTORE_INSTALLER_CERTIFICATE_BASE64 }}
          MAC_APPSTORE_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_APPSTORE_PROVISION_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/mac-appstore-certs.p12"
          installer_cert_path="$RUNNER_TEMP/mac-appstore-installer.cer.pem"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          profile_path="src-tauri/build/appstore/FMO-Dashboard-Mac-AppStore.provisionprofile"

          echo "$MAC_APPSTORE_CERTIFICATE_P12_BASE64" | base64 -D > "$cert_path"
          echo "$MAC_APPSTORE_INSTALLER_CERTIFICATE_BASE64" | base64 -D > "$installer_cert_path"
          security create-keychain -p "$MAC_APPSTORE_CERTIFICATE_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MAC_APPSTORE_CERTIFICATE_PASSWORD" "$keychain_path"
          security import "$cert_path" -P "$MAC_APPSTORE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security import "$installer_cert_path" -A -t cert -f pemseq -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | sed 's/[",]//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MAC_APPSTORE_CERTIFICATE_PASSWORD" "$keychain_path"

          mkdir -p "$(dirname "$profile_path")"
          echo "$MAC_APPSTORE_PROVISION_PROFILE_BASE64" | base64 -D > "$profile_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Build universal macOS app bundle
        if: ${{ env.HAS_MAC_APPSTORE_SIGNING == 'true' }}
        env:
          CI: true
          APPLE_SIGNING_IDENTITY: 3rd Party Mac Developer Application
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri:build -- --bundles app --target universal-apple-darwin --config src-tauri/tauri.appstore.conf.json

      - name: Create signed App Store PKG
        if: ${{ env.HAS_MAC_APPSTORE_SIGNING == 'true' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          app="$(find src-tauri/target -path '*/bundle/macos/*.app' -type d -print -quit)"
          test -n "$app"
          installer_identity="3rd Party Mac Developer Installer: Feng Yu (${APPLE_TEAM_ID})"
          security find-certificate -c "$installer_identity" "$RUNNER_TEMP/app-signing.keychain-db" >/dev/null
          mkdir -p release/macos-appstore
          pkg="release/macos-appstore/FMO-Dashboard-macOS-AppStore-v${version}.pkg"
          xcrun productbuild --sign "$installer_identity" --component "$app" /Applications "$pkg"
          pkgutil --check-signature "$pkg"

      - name: Upload PKG to App Store Connect
        if: ${{ env.HAS_MAC_APPSTORE_SIGNING == 'true' && github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store == 'true' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ env.HAS_APPSTORE_UPLOAD }}" != "true" ]]; then
            echo "App Store Connect API key secrets are not fully configured." >&2
            echo "Required repository secrets for upload:" >&2
            echo "  APPLE_API_KEY_ID" >&2
            echo "  APPLE_API_ISSUER" >&2
            echo "  APPLE_API_KEY_BASE64" >&2
            exit 1
          fi

          mkdir -p private_keys
          echo "$APPLE_API_KEY_BASE64" | base64 -D > "private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          pkg="$(find release/macos-appstore -name '*.pkg' -type f -print -quit)"
          test -n "$pkg"
          xcrun altool --upload-app --type macos --file "$pkg" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"

      - name: Generate macOS App Store checksums
        if: ${{ env.HAS_MAC_APPSTORE_SIGNING == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          shasum -a 256 release/macos-appstore/* > "release/macos-appstore/SHA256SUMS-macos-appstore-v${version}.txt"
          ls -lh release/macos-appstore

      - name: Upload macOS App Store artifacts
        if: ${{ env.HAS_MAC_APPSTORE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: fmo-dashboard-macos-appstore
          path: release/macos-appstore/*
