name: macOS Desktop Release

on:
  workflow_dispatch:
    inputs:
      require_notarization:
        description: Require Apple Developer ID signing and notarization secrets
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      skip_stapling:
        description: Skip waiting for Apple notarization/stapling
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    name: Build universal macOS DMG
    runs-on: macos-latest
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build signed universal app
        if: ${{ env.HAS_APPLE_SIGNING == 'true' }}
        env:
          CI: true
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri:build -- --bundles app --target universal-apple-darwin --skip-stapling 2>&1 | tee tauri-app-build.log

      - name: Wait for app notarization and staple app
        if: ${{ env.HAS_APPLE_SIGNING == 'true' && (github.event_name != 'workflow_dispatch' || inputs.skip_stapling == 'false') }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src-tauri/target -path '*/bundle/macos/*.app' -type d -print -quit)"
          test -n "$app"

          submission_id="$(grep -Eo 'id [0-9a-fA-F-]{36}' tauri-app-build.log | awk '{ print $2 }' | tail -n 1)"
          test -n "$submission_id"
          echo "App notarization submission: $submission_id"

          deadline=$((SECONDS + 7200))
          while true; do
            if xcrun stapler staple "$app"; then
              break
            fi

            if ! info="$(SUBMISSION_ID="$submission_id" python3 - <<'PY'
          import os
          import subprocess
          import sys

          command = [
              'xcrun',
              'notarytool',
              'info',
              os.environ['SUBMISSION_ID'],
              '--apple-id',
              os.environ['APPLE_ID'],
              '--password',
              os.environ['APPLE_PASSWORD'],
              '--team-id',
              os.environ['APPLE_TEAM_ID'],
          ]

          try:
              result = subprocess.run(
                  command, check=False, capture_output=True, text=True, timeout=90
              )
          except subprocess.TimeoutExpired:
              print('notarytool info timed out after 90 seconds', file=sys.stderr)
              sys.exit(124)

          sys.stdout.write(result.stdout)
          sys.stderr.write(result.stderr)
          sys.exit(result.returncode)
          PY
            )"; then
              echo "notarytool info query failed or timed out; retrying." >&2
              if (( SECONDS >= deadline )); then
                echo "Timed out waiting for app notarization." >&2
                exit 124
              fi
              sleep 20
              continue
            fi
            echo "$info"
            status="$(printf '%s\n' "$info" | awk -F': ' '/status:/ { print $2; exit }')"

            case "$status" in
              Accepted)
                break
                ;;
              Invalid|Rejected)
                xcrun notarytool log "$submission_id" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID"
                exit 1
                ;;
            esac

            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for app notarization/stapling." >&2
              exit 124
            fi
            sleep 20
          done

          xcrun stapler validate "$app"
          spctl -a -vvv -t exec "$app"

      - name: Build unsigned universal DMG
        if: ${{ env.HAS_APPLE_SIGNING != 'true' && (github.event_name == 'workflow_dispatch' && inputs.require_notarization == 'false') }}
        env:
          CI: true
        run: npm run tauri:build -- --bundles dmg --target universal-apple-darwin

      - name: Fail when notarization is required but unavailable
        if: ${{ env.HAS_APPLE_SIGNING != 'true' && (github.event_name != 'workflow_dispatch' || inputs.require_notarization == 'true') }}
        shell: bash
        run: |
          echo "Apple Developer ID signing/notarization secrets are not configured." >&2
          echo "Required repository secrets:" >&2
          echo "  APPLE_ID" >&2
          echo "  APPLE_APP_SPECIFIC_PASSWORD" >&2
          echo "  APPLE_TEAM_ID" >&2
          echo "  APPLE_CERTIFICATE_P12_BASE64" >&2
          echo "  APPLE_CERTIFICATE_PASSWORD" >&2
          echo "Optional repository secrets:" >&2
          echo "  APPLE_PROVIDER_SHORT_NAME" >&2
          echo "  APPLE_SIGNING_IDENTITY" >&2
          exit 1

      - name: Create DMG from stapled app
        if: ${{ env.HAS_APPLE_SIGNING == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          app="$(find src-tauri/target -path '*/bundle/macos/*.app' -type d -print -quit)"
          test -n "$app"
          mkdir -p release/macos
          rm -rf release/macos/dmg-root
          mkdir -p release/macos/dmg-root
          cp -R "$app" release/macos/dmg-root/
          ln -s /Applications release/macos/dmg-root/Applications
          dmg="release/macos/FMO-Dashboard-macOS-Universal-v${version}.dmg"
          hdiutil create -volname "FMO仪表盘" -srcfolder release/macos/dmg-root -ov -format UDZO "$dmg"
          identity="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
          if [[ -n "$identity" ]]; then
            codesign --force --timestamp --sign "$identity" "$dmg"
          fi
          rm -rf release/macos/dmg-root

      - name: Stage unsigned macOS artifacts
        if: ${{ env.HAS_APPLE_SIGNING != 'true' && (github.event_name == 'workflow_dispatch' && inputs.require_notarization == 'false') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/macos
          find src-tauri/target -path '*/bundle/dmg/*.dmg' -type f -print -exec cp {} release/macos/ \;
          test -n "$(find release/macos -name '*.dmg' -type f -print -quit)"
          version="$(node -p "require('./package.json').version")"
          for dmg in release/macos/*.dmg; do
            mv "$dmg" "release/macos/FMO-Dashboard-macOS-Universal-v${version}.dmg"
            break
          done

      - name: Generate macOS checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          (
            cd release/macos
            shasum -a 256 FMO-Dashboard-macOS-Universal-v${version}.dmg \
              > "SHA256SUMS-macos-v${version}.txt"
          )
          ls -lh release/macos

      - name: Upload macOS desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fmo-dashboard-macos-desktop
          path: release/macos/*
