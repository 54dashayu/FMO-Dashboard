<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/app-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FMO仪表盘</title>
  <style>
    .legacy-webview-fallback {
      display: none;
      box-sizing: border-box;
      min-height: 100vh;
      padding: 32px 22px;
      color: #162033;
      background: #f6f8fb;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      line-height: 1.65;
    }

    .legacy-webview-fallback h1 {
      margin: 0 0 14px;
      font-size: 22px;
      line-height: 1.3;
    }

    .legacy-webview-fallback p {
      max-width: 720px;
      margin: 0 0 10px;
      font-size: 15px;
    }

    .legacy-webview-fallback code {
      padding: 2px 6px;
      border-radius: 4px;
      background: #e9eef7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }

    .legacy-webview .legacy-webview-fallback {
      display: block;
    }

    .legacy-webview #app {
      display: none;
    }
  </style>
  <script>
    ;(function () {
      var ua = navigator.userAgent || ''
      var isAndroid = /Android/i.test(ua)
      var chromeMatch = ua.match(/(?:Chrome|CriOS)\/(\d+)/i)
      var chromeMajor = chromeMatch ? Number(chromeMatch[1]) : null
      var lacksModule = !('noModule' in document.createElement('script'))
      var tooOld = isAndroid && ((chromeMajor && chromeMajor < 64) || (!chromeMajor && lacksModule))
      if (tooOld) document.documentElement.className += ' legacy-webview'
      window.__FMO_ANDROID_WEBVIEW_PRECHECK__ = {
        isAndroid: isAndroid,
        chromeMajor: chromeMajor,
        lacksModule: lacksModule,
        tooOld: tooOld
      }
    })()
  </script>
</head>

<body>
  <noscript>
    <div class="legacy-webview-fallback" style="display: block">
      <h1>需要启用 JavaScript</h1>
      <p>FMO仪表盘需要 JavaScript 才能运行。请在系统 WebView、浏览器或车机设置中启用脚本后重新打开。</p>
    </div>
  </noscript>
  <div class="legacy-webview-fallback" role="alert">
    <h1>Android System WebView 版本过旧</h1>
    <p>当前设备的 WebView/Chrome 内核太旧，可能无法启动 FMO仪表盘 V2.01，容易出现白屏、闪退或同步异常。</p>
    <p>请先在应用市场升级 <code>Android System WebView</code> 或 <code>Chrome</code>，再重新打开本应用。</p>
    <p>如果车机系统无法升级 WebView，建议改用 Android 10+ 设备、网页版或桌面版。</p>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
